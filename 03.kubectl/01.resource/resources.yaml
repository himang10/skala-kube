apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
data:
  # Base64로 인코딩된 값 (예: "username")
  username: dXNlcm5hbWU=    
  # Base64로 인코딩된 값 (예: "password")
  password: cGFzc3dvcmQ=    
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
  app.properties: |
    app.name=MyApp
    app.version=1.0.0
    app.environment=production
  log.level: INFO
  max.connections: "100"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-pvc
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  storageClassName: efs-sc-shared

