apiVersion: v1
kind: Service
metadata:
  name: skala-webserver
  namespace: class-0
  labels:
    app: skala-webserver
spec:
  type: ClusterIP
  selector:
    app: skala-webserver
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: mgmt
      protocol: TCP
      port: 8081
      targetPort: 8081


