apiVersion: v1
kind: Service
metadata:
  name: sk0199-myfirst-api-server
  namespace: class-0
spec:
  selector:
    app: sk0199-myfirst-api-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: mgmt
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP


